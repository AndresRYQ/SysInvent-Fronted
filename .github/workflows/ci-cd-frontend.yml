name: CI-CD Frontend SysInvent

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integracion-continua:
    name: Validar y compilar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar analisis de codigo
        run: npm run lint

      - name: Compilar aplicacion
        run: npm run build

  entrega-continua:
    name: Generar artefacto frontend
    needs: integracion-continua
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar distribucion
        run: npm run build

      - name: Guardar artefacto frontend
        uses: actions/upload-artifact@v4
        with:
          name: sysinvent-frontend
          path: dist
          if-no-files-found: error
          retention-days: 7